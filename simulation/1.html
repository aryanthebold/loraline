<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoRaLine Mesh Simulation</title>
<style>
:root{--bg:#0b1a2b;--ink:#eaf2ff;--sos:#5ad1ff;--haz:#ff6a3d;--ok:#5ad166;}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,Arial,sans-serif;color:var(--ink);}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#panel{position:fixed;left:12px;top:12px;bottom:12px;width:300px;box-sizing:border-box;padding:16px;display:flex;flex-direction:column;gap:12px;
 background:rgba(12,26,44,.55);border:1px solid rgba(255,255,255,.14);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 box-shadow:0 10px 40px rgba(0,0,0,.4);overflow:hidden;}
h1{font-size:16px;margin:0;letter-spacing:.4px;} .sub{font-size:11px;opacity:.65;margin-top:2px}
.stat{display:flex;justify-content:space-between;font-size:12px;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px}
.btns{display:flex;flex-direction:column;gap:7px}
button{border:none;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;color:#0b1a2b;transition:transform .1s,opacity .2s}
button:disabled{opacity:.4;cursor:default} button:active:not(:disabled){transform:scale(.97)}
#sosBtn{background:var(--sos)} #hazBtn{background:var(--haz)} #resetBtn{background:#cfd6dc} #failBtn{background:#ffd166} #beaconBtn{background:rgba(255,255,255,.12);color:var(--ink);border:1px solid rgba(255,255,255,.25)}
.leg{font-size:10px;opacity:.6;line-height:1.5}.leg span{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin:2px 0 -4px;font-weight:600}
#towers{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tw{background:rgba(255,255,255,.08);color:var(--ink);font-size:11px;font-weight:600;padding:6px 8px;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.1);text-align:left}
.tw i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);flex:none}
.tw.off{background:rgba(255,60,60,.18);border-color:rgba(255,80,80,.5)} .tw.off i{background:#ff3b3b;box-shadow:0 0 6px #ff3b3b}
#log{flex:1;min-height:80px;overflow-y:auto;font-size:12px;display:flex;flex-direction:column;gap:4px;padding-right:2px}
.l{padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.06);border-left:3px solid #6f8db3;line-height:1.35}
.l b{opacity:.5;font-weight:500;font-size:10px;margin-right:4px}
.l.haz{border-color:var(--haz)} .l.sos{border-color:var(--sos)} .l.ok{border-color:var(--ok)} .l.bad{border-color:#ff3b3b;background:rgba(255,60,60,.12)}
#hint{position:fixed;right:14px;bottom:10px;font-size:11px;opacity:.55;pointer-events:none;text-align:right}
@media(max-width:760px){#towers{grid-template-columns:1fr 1fr 1fr}#panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:46vh;padding:12px}#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div><h1>LoRaLine Control Panel</h1><div class="sub">Self-healing mesh &middot; Dijkstra routing</div></div>
  <div class="stat"><span>Towers online</span><b id="online"></b></div>
  <div class="btns">
    <button id="sosBtn">Simulate SOS</button>
    <button id="hazBtn">Simulate Hazard &amp; Broadcast</button>
    <button id="failBtn">Fail 2 Random Towers</button>
    <button id="resetBtn">Repair All Towers</button>
    <button id="beaconBtn">Highlight Beacons: ON</button>
  </div>
  <h2>Relay towers (tap to fail)</h2>
  <div id="towers"></div>
  <div class="leg"><span style="background:#3f8fd0"></span>short link &nbsp;<span style="background:#9a7bd8"></span>long-range backup link</div>
  <h2>Status log</h2>
  <div id="log"></div>
</div>
<div id="hint">Drag to rotate &middot; scroll to zoom<br>Click a glowing tower in 3D to disable it</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x152b47);
scene.fog=new THREE.Fog(0x152b47,300,900);
const camera=new THREE.PerspectiveCamera(50,1,0.5,900);
let camTarget=new THREE.Vector3(10,10,0),camX=0.45,camY=-0.5,camDist=200;
function updateCamera(){camera.position.set(camTarget.x+camDist*Math.cos(camX)*Math.sin(camY),camTarget.y+camDist*Math.sin(camX),camTarget.z+camDist*Math.cos(camX)*Math.cos(camY));camera.lookAt(camTarget);}
updateCamera();

// ---------- lights & shadows ----------
scene.add(new THREE.HemisphereLight(0xcfe3ff,0x3b4a2a,0.75));
const sun=new THREE.DirectionalLight(0xffdca8,1.15);
sun.position.set(160,180,-180);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-200,right:200,top:110,bottom:-110,near:10,far:550});
sun.shadow.bias=-0.0006; scene.add(sun);

// ---------- terrain ----------
function H(x,z){
  const peak=34*Math.exp(-((x/38)**2))*(0.8+0.2*Math.cos(z*0.05));
  return peak+1.4*Math.sin(x*0.13)*Math.cos(z*0.11)+Math.pow(Math.abs(z)/80,2)*9;
}
const W=380,D=170;
const geo=new THREE.BoxGeometry(W,40,D,190,1,60);
const pos=geo.attributes.position, norm=geo.attributes.normal, cols=[];
const cA=new THREE.Color(0x3f7d3f),cB=new THREE.Color(0x8a7350),cC=new THREE.Color(0xf0f0f0);
const cSide=new THREE.Color(0x291d17);
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i), z=pos.getZ(i), y=pos.getY(i), ny=norm.getY(i);
  if(y>0){
    pos.setY(i, H(x,z)+(Math.random()-.5)*.5);
  }else{
    pos.setY(i, -22);
  }
  if(ny>0.5){
    const h=pos.getY(i);
    const t=Math.min(1,h/32),c=t<.6?cA.clone().lerp(cB,t/.6):cB.clone().lerp(cC,(t-.6)/.4);
    cols.push(c.r,c.g,c.b);
  }else{
    cols.push(cSide.r,cSide.g,cSide.b);
  }
}
geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3)); geo.computeVertexNormals();
const ground=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true}));
ground.receiveShadow=true; scene.add(ground);

// ---------- matching background scenery ----------
const starsGeo = new THREE.BufferGeometry();
const starsPos = [];
for(let i=0;i<1200;i++){
  const r = 350 + Math.random()*450;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos(2 * Math.random() - 1);
  starsPos.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
}
starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsPos, 3));
const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({color:0xffffff, size:1.4, transparent:true, opacity:0.7}));
scene.add(stars);

const moonGroup = new THREE.Group();
const moon = new THREE.Mesh(new THREE.SphereGeometry(22, 32, 32), new THREE.MeshBasicMaterial({color: 0xfff4d6}));
const moonGlow = new THREE.Mesh(new THREE.SphereGeometry(28, 32, 32), new THREE.MeshBasicMaterial({color: 0xfff4d6, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false}));
moonGroup.add(moon, moonGlow);
moonGroup.position.set(220, 240, -250);
scene.add(moonGroup);

// ---------- nodes ----------
const defs=[
 {x:-140,z:-6,type:'village',label:'Village A'},
 {x:-108,z:12,type:'village',label:'Village B'},
 {x:-122,z:-16,type:'sensor',label:'Flood Sensor'},
 {x:-95,z:-2,type:'tower',label:'Tower 1'},{x:-78,z:14,type:'tower',label:'Tower 2'},
 {x:-62,z:-10,type:'tower',label:'Tower 3'},{x:-44,z:8,type:'tower',label:'Tower 4'},
 {x:-26,z:-12,type:'tower',label:'Tower 5'},{x:0,z:4,type:'tower',label:'Hilltop Tower'},
 {x:-6,z:36,type:'tower',label:'Ridge North'},{x:8,z:-38,type:'tower',label:'Ridge South'},
 {x:24,z:-10,type:'tower',label:'Tower 6'},{x:46,z:12,type:'tower',label:'Tower 7'},
 {x:68,z:-6,type:'tower',label:'Tower 8'},{x:86,z:10,type:'tower',label:'Tower 9'},
 {x:100,z:-8,type:'village',label:'Village C'},{x:132,z:10,type:'village',label:'Village D'},
 {x:152,z:-4,type:'control',label:'Control Room'}
];
const TOP={village:5,sensor:6,tower:7,control:6.5},SC={village:1.2,sensor:1.5,tower:1.7,control:1.5};
const nodes=defs.map((n,i)=>({...n,idx:i,y:H(n.x,n.z),damaged:false,warn:0,top:TOP[n.type]*SC[n.type],sc:SC[n.type]}));
const towerNodes=nodes.filter(n=>n.type==='tower');
const M=(c)=>new THREE.MeshLambertMaterial({color:c});
function shadow(g){g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});return g;}
function beacon(y,r){const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,12),new THREE.MeshStandardMaterial({color:0x5ad166,emissive:0x5ad166,emissiveIntensity:1}));m.position.y=y;return m;}
function mkVillage(n){
  const g=new THREE.Group();
  [[-3,-2],[0,2.4],[3.2,-.6],[-.5,-5]].forEach(([dx,dz])=>{
    const h=new THREE.Group();
    const b=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.7,2.4),M(0xd8c39a));b.position.y=.85;
    const r=new THREE.Mesh(new THREE.ConeGeometry(2,1.4,4),M(0xa1442e));r.position.y=2.4;r.rotation.y=Math.PI/4;
    h.add(b,r);h.position.set(dx,(H(n.x+dx,n.z+dz)-n.y)/1.2,dz);g.add(h);
  });
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,4,6),M(0xcfd6dc));pole.position.set(0,2,-1);g.add(pole);
  g.userData.light=beacon(4.3,.4);g.userData.light.position.z=-1;g.add(g.userData.light);
  return g;
}
function mkTower(n){
  const g=new THREE.Group(),s=n.type==='sensor'?.8:1,pm=M(0xcfd6dc);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.26,.4,6.5*s,8),pm);pole.position.y=3.25*s;
  const b1=new THREE.Mesh(new THREE.BoxGeometry(2.6,.16,.16),pm);b1.position.y=5.8*s;
  const b2=b1.clone();b2.rotation.y=Math.PI/2;b2.position.y=5.1*s;
  g.add(pole,b1,b2);
  g.userData.pole=pole;g.userData.light=beacon(6.8*s,.4);g.add(g.userData.light);
  if(n.type==='sensor'){pole.material=M(0x9fc8e8);}
  return g;
}
function mkControl(){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(7,3.4,5.5),M(0x3a4a63));base.position.y=1.7;
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,3,6),M(0xcfd6dc));arm.position.y=4.9;
  const dish=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,.3,20),new THREE.MeshLambertMaterial({color:0xe8e8e8,side:THREE.DoubleSide}));
  dish.rotation.x=Math.PI/2.6;dish.position.set(0,6.4,.3);
  g.add(base,arm,dish);g.userData.light=beacon(3.6,.4);g.userData.light.position.z=2.9;g.add(g.userData.light);
  return g;
}
nodes.forEach(n=>{
  n.mesh=n.type==='village'?mkVillage(n):n.type==='control'?mkControl():mkTower(n);
  n.mesh.position.set(n.x,n.y,n.z);n.mesh.scale.setScalar(n.sc);shadow(n.mesh);
  const hr=n.type==='village'?6:7.5,mk=(g,o)=>new THREE.MeshBasicMaterial({color:0x5ad166,transparent:true,opacity:o,side:THREE.DoubleSide,depthWrite:false,depthTest:g});
  n.halo=new THREE.Mesh(new THREE.RingGeometry(hr*.72,hr,48),mk(false,.5));n.halo.renderOrder=2;
  n.halo.rotation.x=-Math.PI/2;n.halo.position.set(n.x,n.y+.5,n.z);scene.add(n.halo);
  const bh=n.type==='village'?12:20;
  n.beam=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,bh,8,1,true),mk(true,.25));
  n.beam.position.set(n.x,n.y+n.top+bh/2,n.z);scene.add(n.beam);
  n.mesh.userData.light.castShadow=false;scene.add(n.mesh);
});
const lightOf=n=>n.mesh.userData.light.material;
function setLight(n,c,i){const m=lightOf(n);m.color.setHex(c);m.emissive.setHex(c);m.emissiveIntensity=i;
  const k=Math.min(1,i);n.halo.material.color.setHex(c);n.halo.material.opacity=.25+.4*k;
  n.beam.material.color.setHex(c);n.beam.material.opacity=.1+.25*k;}

// ---------- trees (instanced, low-poly) ----------
(function(){
  const NT=380,trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.3,.45,2,6),M(0x6b4a2b),NT);
  const c1=new THREE.InstancedMesh(new THREE.ConeGeometry(1.9,4,7),M(0xffffff),NT);
  const c2=new THREE.InstancedMesh(new THREE.ConeGeometry(1.4,3.2,7),M(0xffffff),NT);
  const o=new THREE.Object3D(),col=new THREE.Color();let k=0,tries=0;
  while(k<NT&&tries++<5000){
    const x=(Math.random()-.5)*(W-32),z=(Math.random()-.5)*(D-28),h=H(x,z);
    if(h>21||nodes.some(n=>Math.hypot(n.x-x,n.z-z)<14))continue;
    const s=.8+Math.random()*.9,rot=Math.random()*6;
    o.rotation.y=rot;o.scale.setScalar(s);
    o.position.set(x,h+s,z);o.updateMatrix();trunk.setMatrixAt(k,o.matrix);
    o.position.set(x,h+3.6*s,z);o.updateMatrix();c1.setMatrixAt(k,o.matrix);
    o.position.set(x,h+5.2*s,z);o.updateMatrix();c2.setMatrixAt(k,o.matrix);
    col.setHSL(.27+Math.random()*.07,.5,.2+Math.random()*.1);c1.setColorAt(k,col);c2.setColorAt(k,col.offsetHSL(0,0,.05));
    k++;
  }
  [trunk,c1,c2].forEach(m=>{m.count=k;m.castShadow=true;m.receiveShadow=true;scene.add(m);});
})();

// ---------- edges ----------
const d3=(a,b)=>Math.hypot(a.x-b.x,(a.y-b.y)*.7,a.z-b.z);
const edges=[];
for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
  const w=d3(nodes[i],nodes[j]);
  if(w<78){
    const a=nodes[i],b=nodes[j];
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(a.x,a.y+a.top,a.z),new THREE.Vector3(b.x,b.y+b.top,b.z)]),
      new THREE.LineBasicMaterial({color:w>50?0x9a7bd8:0x3f8fd0,transparent:true,opacity:w>50?.22:.38}));
    scene.add(line);edges.push({i,j,w,line,backup:w>50});
  }
}
function shortest(src){
  const N=nodes.length,dist=Array(N).fill(Infinity),prev=Array(N).fill(-1),vis=Array(N).fill(false);
  const adj=Array.from({length:N},()=>[]);
  edges.forEach(e=>{if(nodes[e.i].damaged||nodes[e.j].damaged)return;const w=e.w*e.w/30;adj[e.i].push([e.j,w]);adj[e.j].push([e.i,w]);});
  dist[src]=0;
  for(let k=0;k<N;k++){
    let u=-1,b=Infinity;for(let i=0;i<N;i++)if(!vis[i]&&dist[i]<b){b=dist[i];u=i;}
    if(u<0)break;vis[u]=true;
    adj[u].forEach(([v,w])=>{if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u;}});
  }
  return {dist,prev};
}
function pathTo(r,dst){
  if(r.dist[dst]===Infinity)return null;
  const p=[];for(let c=dst;c!==-1;c=r.prev[c])p.unshift(nodes[c]);return p;
}
const controlIdx=nodes.findIndex(n=>n.type==='control');

// ---------- effects ----------
const pulses=[];
function ring(x,y,z,color,max,life){
  const m=new THREE.Mesh(new THREE.RingGeometry(.5,.9,32),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85,side:THREE.DoubleSide,depthTest:false}));
  m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.userData={t:0,max,life};scene.add(m);pulses.push(m);
}
const packet=new THREE.Mesh(new THREE.SphereGeometry(.8,16,16),new THREE.MeshStandardMaterial({color:0xffd166,emissive:0xffb347,emissiveIntensity:1.4}));
packet.add(new THREE.PointLight(0xffd166,1.4,18));packet.visible=false;scene.add(packet);
let pathLine=null;
function drawPath(p,color){
  if(pathLine)scene.remove(pathLine);
  pathLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(p.map(n=>new THREE.Vector3(n.x,n.y+n.top+.3,n.z))),new THREE.LineBasicMaterial({color}));
  scene.add(pathLine);
}
const bcRing=new THREE.Mesh(new THREE.RingGeometry(.97,1,128),new THREE.MeshBasicMaterial({color:0xff8a3d,transparent:true,opacity:.9,side:THREE.DoubleSide,depthTest:false}));
bcRing.rotation.x=-Math.PI/2;bcRing.visible=false;scene.add(bcRing);
const bcDome=new THREE.Mesh(new THREE.SphereGeometry(1,40,20),new THREE.MeshBasicMaterial({color:0xff8a3d,transparent:true,opacity:.1,depthWrite:false}));
bcDome.visible=false;scene.add(bcDome);

// ---------- UI ----------
const $=id=>document.getElementById(id),logEl=$('log'),hazBtn=$('hazBtn'),sosBtn=$('sosBtn');
function log(msg,cls){
  const d=document.createElement('div');d.className='l '+(cls||'');
  d.innerHTML='<b>'+new Date().toLocaleTimeString([], {hour12:false})+'</b>'+msg;
  logEl.prepend(d);while(logEl.children.length>80)logEl.lastChild.remove();
}
const twEl=$('towers');
towerNodes.forEach(n=>{
  const b=document.createElement('button');b.className='tw';b.innerHTML='<i></i><span>'+n.label+'</span>';
  b.onclick=()=>toggle(n);n.btn=b;twEl.appendChild(b);
});
function toggle(n,force){
  n.damaged=force===undefined?!n.damaged:force;
  n.mesh.rotation.z=n.damaged?.35:0;
  n.mesh.userData.pole.material.color.setHex(n.damaged?0x7a3a3a:0xcfd6dc);
  n.btn.classList.toggle('off',n.damaged);
  $('online').textContent=towerNodes.filter(t=>!t.damaged).length+' / '+towerNodes.length;
}
function toggleLog(n){toggle(n);log(n.damaged?n.label+' <b style="opacity:1;color:#ff6b6b">OFFLINE</b> - routes will avoid it.':n.label+' back online.',n.damaged?'bad':'ok');}
towerNodes.forEach(n=>n.btn.onclick=()=>toggleLog(n));
toggle(towerNodes[0],false);
$('failBtn').onclick=()=>{
  const up=towerNodes.filter(t=>!t.damaged);
  for(let k=0;k<2&&up.length;k++){const n=up.splice(Math.floor(Math.random()*up.length),1)[0];toggle(n,true);log(n.label+' <b style="opacity:1;color:#ff6b6b">OFFLINE</b> (simultaneous failure).','bad');}
  log('Two towers failed together. Run an alert to see the mesh route around them.','bad');
};
let beaconsOn=true;
$('beaconBtn').onclick=()=>{
  beaconsOn=!beaconsOn;
  nodes.forEach(n=>{n.halo.visible=n.beam.visible=beaconsOn;});
  $('beaconBtn').textContent='Highlight Beacons: '+(beaconsOn?'ON':'OFF');
  log('Tower highlight beacons turned '+(beaconsOn?'on.':'off.'));
};
$('resetBtn').onclick=()=>{towerNodes.forEach(n=>toggle(n,false));log('All towers repaired. Mesh fully connected.','ok');};

// ---------- simulation state machine ----------
const st={mode:'idle'};
const HOP=.85,PAUSE=.3;
function setBusy(b){hazBtn.disabled=sosBtn.disabled=b;}
function finish(){st.mode='idle';packet.visible=false;setBusy(false);if(pathLine){scene.remove(pathLine);pathLine=null;}}
function startAlert(src,kind){
  if(st.mode!=='idle')return;
  const p=pathTo(shortest(src.idx),controlIdx);
  if(!p){log('No route from '+src.label+' to Control Room - too many towers offline!','bad');return;}
  st.mode='flight';st.kind=kind;st.path=p;st.hop=0;st.t=0;st.pausing=false;st.pauseT=0;
  st.color=kind==='haz'?0xff6a3d:0x5ad1ff;
  packet.material.color.setHex(st.color);packet.material.emissive.setHex(st.color);
  packet.visible=true;packet.position.set(src.x,src.y+src.top,src.z);
  setBusy(true);drawPath(p,st.color);ring(src.x,src.y+.5,src.z,st.color,16,.8);
  log(kind==='haz'?'Hazard detected at '+src.label+'! Routing to Control Room ('+(p.length-1)+' hops).':'SOS pressed at '+src.label+'! Routing to Control Room ('+(p.length-1)+' hops).',kind);
  beginHop();
}
function beginHop(){
  let cur=st.path[st.hop],next=st.path[st.hop+1];
  if(next&&next.damaged){
    const np=pathTo(shortest(cur.idx),controlIdx);
    if(!np){log('Alert stuck at '+cur.label+': no live route to Control Room.','bad');finish();return;}
    st.path=np;st.hop=0;next=np[1];drawPath(np,st.color);
    log('<span style="color:#ffd166">Rerouting</span> from '+cur.label+' around offline node (new path: '+(np.length-1)+' hops).','bad');
  }
  if(next){const e=edges.find(e=>(e.i===cur.idx&&e.j===next.idx)||(e.j===cur.idx&&e.i===next.idx));
    log('Hop '+(st.hop+1)+'/'+(st.path.length-1)+': '+cur.label+' \u2192 '+next.label+(e&&e.backup?' <span style="color:#b9a0f0">(long-range backup link)</span>':''));}
  st.t=0;
}
function startBroadcast(){
  const c=nodes[controlIdx];
  st.mode='broadcast';st.r=0;st.reach=shortest(controlIdx).dist;
  st.pendingNodes=nodes.filter(n=>n.idx!==controlIdx).map(n=>({n,d:Math.hypot(n.x-c.x,n.z-c.z)}));
  bcRing.position.set(c.x,c.y+2,c.z);bcDome.position.set(c.x,c.y,c.z);
  bcRing.visible=bcDome.visible=true;
  c.warn=6;
  log('Control Room received hazard. <b style="opacity:1">MESH BROADCAST</b> started - warning all active nodes.','haz');
}
hazBtn.onclick=()=>startAlert(nodes.find(n=>n.type==='sensor'),'haz');
sosBtn.onclick=()=>{
  const v=nodes.filter(n=>n.type==='village');
  startAlert(v[Math.floor(Math.random()*v.length)],'sos');
};

// ---------- main loop ----------
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05),now=performance.now()*.001;

  if(st.mode==='flight'){
    const path=st.path,a=path[st.hop],b=path[st.hop+1];
    if(st.pausing){
      st.pauseT+=dt;packet.scale.setScalar(1+.4*Math.sin(st.pauseT*14));
      if(st.pauseT>PAUSE){st.pausing=false;st.hop++;packet.scale.setScalar(1);
        if(st.hop>=path.length-1){
          if(st.kind==='haz')startBroadcast();
          else{log('Help request reached Control Room. Rescue dispatched.','ok');ring(nodes[controlIdx].x,nodes[controlIdx].y+.5,nodes[controlIdx].z,0x5ad1ff,25,1);finish();}
        }else beginHop();
      }
    }else if(b){
      st.t+=dt/HOP;const tt=Math.min(1,st.t),arc=Math.sin(tt*Math.PI)*4;
      packet.position.set(a.x+(b.x-a.x)*tt,a.y+a.top+(b.y+b.top-a.y-a.top)*tt+arc,a.z+(b.z-a.z)*tt);
      if(st.t>=1){st.pausing=true;st.pauseT=0;ring(b.x,b.y+.5,b.z,st.color,10,.6);}
    }
  }else if(st.mode==='broadcast'){
    st.r+=dt*75;const r=st.r,fade=Math.max(0,1-r/300);
    bcRing.scale.set(r,r,r);bcRing.material.opacity=.9*fade;
    bcDome.scale.set(r,r,r);bcDome.material.opacity=.1*fade;
    for(let i=st.pendingNodes.length-1;i>=0;i--){
      const {n,d}=st.pendingNodes[i];
      if(r>=d){
        st.pendingNodes.splice(i,1);
        if(n.damaged)log(n.label+' is offline - broadcast skipped.','bad');
        else if(st.reach[n.idx]===Infinity)log(n.label+' is cut off from the mesh - not reached!','bad');
        else{n.warn=7;ring(n.x,n.y+.5,n.z,0xff8a3d,14,.9);
          if(n.type==='village')log('\u26A0 '+n.label+' warned of hazard.','haz');}
      }
    }
    if(r>330){bcRing.visible=bcDome.visible=false;log('Broadcast complete.','ok');finish();}
  }

  for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i],u=p.userData;u.t+=dt;const k=u.t/u.life;
    p.scale.setScalar(1+k*u.max);p.material.opacity=Math.max(0,.85*(1-k));
    if(k>=1){scene.remove(p);p.geometry.dispose();p.material.dispose();pulses.splice(i,1);}
  }

  nodes.forEach(n=>{
    if(n.warn>0)n.warn-=dt;
    const pl=.6+.4*Math.sin(now*4+n.x);
    if(n.damaged)setLight(n,0xff2a2a,1.1);
    else if(n.warn>0)setLight(n,0xff8a3d,.5+.9*(Math.sin(now*14)>0?1:.2));
    else if(n.type==='control')setLight(n,0x5ad1ff,.8+.3*Math.sin(now*3));
    else if(n.type==='sensor')setLight(n,0x5ad1ff,pl);
    else setLight(n,0x5ad166,pl);
  });
  edges.forEach(e=>{
    const a=nodes[e.i],b=nodes[e.j],m=e.line.material;
    if(a.damaged||b.damaged){m.color.setHex(0xff3b3b);m.opacity=.18;}
    else if(a.warn>0&&b.warn>0){m.color.setHex(0xff8a3d);m.opacity=.95;}
    else{m.color.setHex(e.backup?0x9a7bd8:0x3f8fd0);m.opacity=e.backup?.22:.38;}
  });
  renderer.render(scene,camera);
}
animate();

// ---------- input ----------
const ray=new THREE.Raycaster();
function pick(cx,cy){
  const r=canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1),camera);
  const hit=ray.intersectObjects(towerNodes.map(n=>n.mesh),true)[0];
  if(!hit)return;
  let o=hit.object;while(o&&!towerNodes.find(n=>n.mesh===o))o=o.parent;
  const n=towerNodes.find(n=>n.mesh===o);if(n)toggleLog(n);
}
let down=null,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(!down)return;
  camY-=(e.clientX-lx)*.006;camX=Math.max(.08,Math.min(1.25,camX+(e.clientY-ly)*.006));
  lx=e.clientX;ly=e.clientY;updateCamera();
});
canvas.addEventListener('pointerup',e=>{
  if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<5)pick(e.clientX,e.clientY);down=null;
});
canvas.addEventListener('wheel',e=>{camDist=Math.max(50,Math.min(320,camDist+e.deltaY*.1));updateCamera();},{passive:true});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize);resize();
log('Mesh online: '+nodes.length+' nodes, '+edges.length+' links. Trigger an alert or disable a tower.','ok');
</script>
</body>
