<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoRaLine Mesh Hop Simulation</title>
<style>
  :root{--bg:#0b1a2b;--ink:#eaf2ff;--accent:#ffb347;--sos:#5ad1ff;--haz:#ff6a3d;}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,Arial,sans-serif;color:var(--ink);}
  #c{width:100%;height:100%;display:block;touch-action:none;}
  .ui{position:fixed;left:0;right:0;top:0;padding:14px 16px calc(10px + env(safe-area-inset-top,0px));
      pointer-events:none;text-align:center;}
  .ui h1{font-size:16px;margin:0 0 4px;letter-spacing:.3px;}
  .ui p{margin:0;font-size:12px;opacity:.75;}
  #hint{position:fixed;top:58px;left:0;right:0;text-align:center;font-size:11px;opacity:.55;pointer-events:none;}
  .status{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));
      display:flex;flex-direction:column;gap:8px;align-items:center;}
  .pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:999px;
      padding:8px 16px;font-size:13px;backdrop-filter:blur(6px);max-width:92vw;text-align:center;}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  button{border:none;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;color:#0b1a2b;}
  button:disabled{opacity:.45;cursor:default;}
  #hazBtn{background:var(--haz);} #sosBtn{background:var(--sos);} #resetBtn{background:#cfd6dc;}
  button:active:not(:disabled){transform:scale(0.96);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <h1>LoRaLine &mdash; Mesh Alert Simulation</h1>
  <p>A real mesh of towers, alerts take the shortest live path to Control Room</p>
</div>
<div id="hint">Drag to rotate &middot; scroll to zoom &middot; tap a tower to damage it</div>
<div class="status">
  <div class="pill" id="hopLabel">Mesh ready. Trigger an alert below.</div>
  <div class="row">
    <button id="hazBtn">Simulate Flood / Fire</button>
    <button id="sosBtn">Simulate SOS</button>
    <button id="resetBtn">Repair all towers</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b1a2b, 70, 220);
scene.background = new THREE.Color(0x0b1a2b);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 600);
let camTarget = new THREE.Vector3(5,14,0);
let camAngleX = 0.4, camAngleY = -0.55, camDist = 130;
function updateCamera(){
  camera.position.set(
    camTarget.x + camDist*Math.cos(camAngleX)*Math.sin(camAngleY),
    camTarget.y + camDist*Math.sin(camAngleX),
    camTarget.z + camDist*Math.cos(camAngleX)*Math.cos(camAngleY)
  );
  camera.lookAt(camTarget);
}
updateCamera();

let dragging=false,lastX=0,lastY=0;
function pDown(x,y){dragging=true;lastX=x;lastY=y;}
function pMove(x,y){ if(!dragging)return;
  camAngleY -= (x-lastX)*0.006;
  camAngleX = Math.max(0.08, Math.min(1.1, camAngleX + (y-lastY)*0.006));
  lastX=x;lastY=y; updateCamera();
}
canvas.addEventListener('mousedown', e=>pDown(e.clientX,e.clientY));
window.addEventListener('mousemove', e=>pMove(e.clientX,e.clientY));
window.addEventListener('mouseup', ()=>dragging=false);
canvas.addEventListener('touchstart', e=>{const t=e.touches[0];pDown(t.clientX,t.clientY);},{passive:true});
canvas.addEventListener('touchmove', e=>{const t=e.touches[0];pMove(t.clientX,t.clientY);},{passive:true});
canvas.addEventListener('touchend', ()=>dragging=false);
canvas.addEventListener('wheel', e=>{camDist=Math.max(45,Math.min(210,camDist+e.deltaY*0.06));updateCamera();},{passive:true});

scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x1a2b1a, 0.9));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.0);
sun.position.set(-40,60,20);
scene.add(sun);

function terrainHeight(x){
  const peak=24, spread=17;
  return peak*Math.exp(-((x/spread)**2)) + 1.2*Math.sin(x*0.25);
}
const W=210,D=90,SX=110,SZ=36;
const geo = new THREE.PlaneGeometry(W,D,SX,SZ);
geo.rotateX(-Math.PI/2);
const colors=[]; const c1=new THREE.Color(0x2f6b3a), c2=new THREE.Color(0x8a7350), c3=new THREE.Color(0xe8e8e8);
const pos = geo.attributes.position;
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i);
  const h = terrainHeight(x) + (Math.random()-0.5)*0.6;
  pos.setY(i,h);
  const t = Math.min(1,h/24);
  const col = t<0.55 ? c1.clone().lerp(c2, t/0.55) : c2.clone().lerp(c3,(t-0.55)/0.45);
  colors.push(col.r,col.g,col.b);
}
geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
geo.computeVertexNormals();
const ground = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({vertexColors:true, flatShading:true}));
scene.add(ground);

const nodeDefs = [
  {x:-75, z:-4, type:'village', label:'Village A'},
  {x:-58, z:6,  type:'tower',   label:'Flood Sensor Node'},
  {x:-42, z:-8, type:'tower',   label:'Tower 1'},
  {x:-28, z:5,  type:'tower',   label:'Tower 2'},
  {x:-14, z:-6, type:'tower',   label:'Tower 3'},
  {x:0,   z:2,  type:'tower',   label:'Hilltop Tower'},
  {x:14,  z:-7, type:'tower',   label:'Tower 4'},
  {x:30,  z:6,  type:'tower',   label:'Tower 5'},
  {x:46,  z:-4, type:'tower',   label:'Tower 6'},
  {x:60,  z:5,  type:'tower',   label:'Tower 7'},
  {x:75,  z:-3, type:'village', label:'Village B'},
  {x:92,  z:1,  type:'control', label:'Control Room'},
];
const nodes = nodeDefs.map(n=>({...n, y:terrainHeight(n.x), damaged:false}));

function hut(x,y,z){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.6,2.2), new THREE.MeshLambertMaterial({color:0xd8c39a}));
  body.position.y=0.8; g.add(body);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1.8,1.3,4), new THREE.MeshLambertMaterial({color:0xa1442e}));
  roof.position.y=2.25; roof.rotation.y=Math.PI/4; g.add(roof);
  g.position.set(x,y,z); return g;
}
function villageGroup(n){
  const g=new THREE.Group();
  [[-2.6,-1.5],[0,1.8],[2.8,-0.4]].forEach(([dx,dz])=>g.add(hut(dx,0,dz)));
  g.position.set(n.x,n.y,n.z); return g;
}
function towerGroup(n){
  const g=new THREE.Group();
  const poleMat = new THREE.MeshLambertMaterial({color:0xcfd6dc});
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.38,6.5,8), poleMat);
  pole.position.y=3.25; g.add(pole);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.16,0.16), poleMat);
  bar.position.y=5.8; g.add(bar);
  const bar2=bar.clone(); bar2.rotation.y=Math.PI/2; bar2.position.y=5.1; g.add(bar2);
  const light=new THREE.Mesh(new THREE.SphereGeometry(0.32,12,12),
    new THREE.MeshStandardMaterial({color:0xff5a5a, emissive:0xff2020, emissiveIntensity:1}));
  light.position.y=6.8; g.add(light);
  g.userData.pole=pole; g.userData.light=light;
  g.position.set(n.x,n.y,n.z); return g;
}
function controlRoomGroup(n){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(6,3.2,5), new THREE.MeshLambertMaterial({color:0x3a4a63}));
  base.position.y=1.6; g.add(base);
  const dishArm=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,3,6), new THREE.MeshLambertMaterial({color:0xcfd6dc}));
  dishArm.position.set(0,4.5,0); g.add(dishArm);
  const dish=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,0.3,20), new THREE.MeshLambertMaterial({color:0xe8e8e8, side:THREE.DoubleSide}));
  dish.rotation.x=Math.PI/2.6; dish.position.set(0,6,0.3); g.add(dish);
  const light=new THREE.Mesh(new THREE.SphereGeometry(0.35,12,12),
    new THREE.MeshStandardMaterial({color:0x5ad1ff, emissive:0x2aa8dd, emissiveIntensity:1.1}));
  light.position.set(0,3.4,2.7); g.add(light);
  g.userData.light=light;
  g.position.set(n.x,n.y,n.z); return g;
}

nodes.forEach(n=>{
  if(n.type==='village') n.mesh=villageGroup(n);
  else if(n.type==='control') n.mesh=controlRoomGroup(n);
  else n.mesh=towerGroup(n);
  scene.add(n.mesh);
});

// build mesh edges: chain + skip-2 guaranteed, plus any close pairs
const N = nodes.length;
function dist3(a,b){ return Math.hypot(a.x-b.x, (a.y-b.y)*1.4, a.z-b.z); }
const edgeSet = new Set(), edges = [];
function addEdge(i,j){
  const key = i<j? i+'-'+j : j+'-'+i;
  if(edgeSet.has(key) || i===j) return;
  edgeSet.add(key); edges.push([i,j,dist3(nodes[i],nodes[j])]);
}
for(let i=0;i<N;i++){
  if(i+1<N) addEdge(i,i+1);
  if(i+2<N) addEdge(i,i+2);
}
for(let i=0;i<N;i++) for(let j=i+3;j<N;j++) if(dist3(nodes[i],nodes[j])<24) addEdge(i,j);

const lineMat = new THREE.LineBasicMaterial({color:0x3f6f9a, transparent:true, opacity:0.35});
edges.forEach(([i,j])=>{
  const a=nodes[i], b=nodes[j];
  const g=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(a.x,a.y+6,a.z), new THREE.Vector3(b.x,b.y+6,b.z)
  ]);
  scene.add(new THREE.Line(g, lineMat));
});
let pathLine = null;
function drawPathLine(path){
  if(pathLine) scene.remove(pathLine);
  const pts = path.map(n=>new THREE.Vector3(n.x,n.y+6.3,n.z));
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  pathLine = new THREE.Line(g, new THREE.LineBasicMaterial({color:0xffd166, linewidth:2}));
  scene.add(pathLine);
}

function dijkstra(startIdx, endIdx){
  const dist = new Array(N).fill(Infinity), prev = new Array(N).fill(-1), visited = new Array(N).fill(false);
  dist[startIdx]=0;
  const adj = Array.from({length:N},()=>[]);
  edges.forEach(([i,j,w])=>{
    if(nodes[i].damaged || nodes[j].damaged) return;
    adj[i].push([j,w]); adj[j].push([i,w]);
  });
  for(let k=0;k<N;k++){
    let u=-1, best=Infinity;
    for(let i=0;i<N;i++) if(!visited[i] && dist[i]<best){best=dist[i];u=i;}
    if(u===-1) break;
    visited[u]=true;
    adj[u].forEach(([v,w])=>{ if(dist[u]+w<dist[v]){dist[v]=dist[u]+w; prev[v]=u;} });
  }
  if(dist[endIdx]===Infinity) return null;
  const path=[]; let cur=endIdx;
  while(cur!==-1){ path.unshift(cur); cur=prev[cur]; }
  return path.map(i=>nodes[i]);
}

const packet = new THREE.Mesh(new THREE.SphereGeometry(0.75,16,16),
  new THREE.MeshStandardMaterial({color:0xffd166, emissive:0xffb347, emissiveIntensity:1.4}));
packet.visible=false;
const packetLight = new THREE.PointLight(0xffd166,1.3,16);
packet.add(packetLight);
scene.add(packet);

const ringMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.8, side:THREE.DoubleSide});
function spawnPulse(node, color){
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.5,0.9,32), ringMat.clone());
  ring.material.color.set(color);
  ring.rotation.x=-Math.PI/2;
  ring.position.set(node.x, node.y+0.4, node.z);
  scene.add(ring);
  ring.userData.t=0;
  pulses.push(ring);
}
const pulses = [];

const hopLabel = document.getElementById('hopLabel');
const hazBtn = document.getElementById('hazBtn'), sosBtn = document.getElementById('sosBtn'), resetBtn = document.getElementById('resetBtn');

let running=false, path=null, hopIdx=0, t=0, pausing=false, pauseT=0, endMsg='', color=0xffd166;
const HOP_TIME=0.85, PAUSE_TIME=0.35, END_PAUSE=1.8;
let sosToggle=0;

function setButtons(disabled){ hazBtn.disabled=disabled; sosBtn.disabled=disabled; }

function startAlert(sourceIdx, kind){
  if(running) return;
  const controlIdx = nodes.findIndex(n=>n.type==='control');
  const p = dijkstra(sourceIdx, controlIdx);
  if(!p){ hopLabel.textContent='No path available, too many towers damaged!'; return; }
  path=p; hopIdx=0; t=0; pausing=false; pauseT=0; running=true;
  setButtons(true);
  color = kind==='haz' ? 0xff6a3d : 0x5ad166;
  packet.material.color.set(color); packet.material.emissive.set(color); packetLight.color.set(color);
  drawPathLine(path);
  spawnPulse(nodes[sourceIdx], color);
  const startLabel = kind==='haz'
    ? `Hazard detected at ${nodes[sourceIdx].label}! Alerting nearby nodes...`
    : `SOS pressed at ${nodes[sourceIdx].label}! Sending alert for help...`;
  hopLabel.textContent = startLabel;
  endMsg = kind==='haz' ? 'Alert reached Control Room. Authorities notified.' : 'Help request reached Control Room.';
  packet.visible=true;
  packet.position.set(path[0].x, path[0].y+6.3, path[0].z);
}

hazBtn.addEventListener('click', ()=>{
  const idx = nodes.findIndex(n=>n.label==='Flood Sensor Node');
  startAlert(idx, 'haz');
});
sosBtn.addEventListener('click', ()=>{
  const villages = nodes.map((n,i)=>({n,i})).filter(o=>o.n.type==='village');
  sosToggle = 1-sosToggle;
  startAlert(villages[sosToggle].i, 'sos');
});
resetBtn.addEventListener('click', ()=>{
  nodes.forEach(n=>{ if(n.type==='tower'){ n.damaged=false; n.mesh.rotation.z=0; n.mesh.userData.pole.material.color.set(0xcfd6dc);} });
  hopLabel.textContent='All towers repaired. Mesh fully connected.';
});

function setHop(i){
  const a=path[i], b=path[i+1];
  if(b) hopLabel.textContent = `Hop ${i+1} of ${path.length-1}: ${a.label} -> ${b.label}`;
}

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(),0.05);

  if(running){
    if(hopIdx < path.length-1){
      if(pausing){
        pauseT+=dt;
        packet.scale.setScalar(1+0.4*Math.sin(pauseT*14));
        if(pauseT>PAUSE_TIME){ pausing=false; pauseT=0; hopIdx++; t=0; if(hopIdx<path.length-1) setHop(hopIdx); }
      } else {
        t += dt/HOP_TIME;
        const a=path[hopIdx], b=path[hopIdx+1], tt=Math.min(1,t);
        const arc = Math.sin(tt*Math.PI)*4;
        packet.position.set(a.x+(b.x-a.x)*tt, a.y+6.3+(b.y-a.y)*tt+arc, a.z+(b.z-a.z)*tt);
        packet.scale.setScalar(1);
        if(t>=1){ pausing=true; pauseT=0; if(hopIdx===0) setHop(0); }
      }
    } else {
      pauseT+=dt;
      hopLabel.textContent = endMsg;
      if(pauseT>END_PAUSE){ running=false; packet.visible=false; setButtons(false); if(pathLine){scene.remove(pathLine);pathLine=null;} }
    }
  }

  for(let i=pulses.length-1;i>=0;i--){
    const r=pulses[i]; r.userData.t+=dt;
    const s=1+r.userData.t*14; r.scale.set(s,s,s);
    r.material.opacity = Math.max(0,0.8-r.userData.t*1.1);
    if(r.userData.t>0.75){ scene.remove(r); pulses.splice(i,1); }
  }

  nodes.forEach(n=>{
    if(n.type==='tower'){
      const pulse=0.6+0.4*Math.sin(performance.now()*0.004+n.x);
      n.mesh.userData.light.material.emissiveIntensity = n.damaged? 0.25 : pulse;
    } else if(n.type==='control'){
      n.mesh.userData.light.material.emissiveIntensity = 0.8+0.3*Math.sin(performance.now()*0.003);
    }
  });

  renderer.render(scene, camera);
}
animate();

const ray = new THREE.Raycaster();
function handlePick(cx,cy){
  const rect = canvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(((cx-rect.left)/rect.width)*2-1, -((cy-rect.top)/rect.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const towerMeshes = nodes.filter(n=>n.type==='tower').map(n=>n.mesh);
  const hits = ray.intersectObjects(towerMeshes, true);
  if(hits.length){
    let obj=hits[0].object;
    while(obj.parent && !nodes.find(n=>n.mesh===obj)) obj=obj.parent;
    const n = nodes.find(n=>n.mesh===obj);
    if(n){
      n.damaged=!n.damaged;
      n.mesh.rotation.z = n.damaged?0.35:0;
      n.mesh.userData.pole.material.color.set(n.damaged?0x7a3a3a:0xcfd6dc);
      hopLabel.textContent = n.damaged? `${n.label} damaged! Next alert will reroute around it.` : `${n.label} restored.`;
    }
  }
}
let downX=0,downY=0;
canvas.addEventListener('mousedown', e=>{downX=e.clientX;downY=e.clientY;});
canvas.addEventListener('mouseup', e=>{ if(Math.hypot(e.clientX-downX,e.clientY-downY)<4) handlePick(e.clientX,e.clientY); });

function resize(){ const w=innerWidth,h=innerHeight; camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); }
window.addEventListener('resize', resize); resize();
</script>
</body>
</html>
